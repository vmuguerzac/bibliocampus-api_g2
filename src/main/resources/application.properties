spring.application.name=bibliocampus-api

# Puerto 8081: el que usa Angular (src/app/api.ts)
server.port=${PORT:8081}

# Base de Datos (H2) #
spring.datasource.url=jdbc:h2:file:./data/bibliocampus
spring.datasource.username=sa
spring.datasource.password=

# Creacion de Tablas usando las entidades (solo usar en desarrollo)
spring.jpa.hibernate.ddl-auto=update

# Activar la consola web de H2 (http://localhost:8081/h2-console)
spring.h2.console.enabled=true

#CORS
bibliocampus.cors.origenes=${CORS_ORIGENES:http://localhost:4200}